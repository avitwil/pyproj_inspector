
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyproj_inspector"
version = "0.1.3"
description = "Analyze and package Python projects"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Avi Twil" }]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "packaging>=21.0",
]

[project.scripts]
pyproj_inspector = "pyproj_inspector.cli:main"

[tool.setuptools]
packages = ["pyproj_inspector"]
